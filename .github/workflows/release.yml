name: Release

on:
  push:
    tags:
      - v*.*.*

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            arch: x64
            wails_platform: linux/amd64
          - name: linux-arm64
            os: ubuntu-22.04-arm
            arch: arm64
            wails_platform: linux/arm64
          - name: mac-x64
            os: macos-latest
            arch: x64
            wails_platform: darwin/amd64
          - name: mac-arm64
            os: macos-latest
            arch: arm64
            wails_platform: darwin/arm64
          - name: win-x64
            os: windows-latest
            arch: x64
            wails_platform: windows/amd64
          - name: win-arm64
            os: windows-11-arm
            arch: arm64
            wails_platform: windows/arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Git clone repo (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        env:
          GIT_USER: ${{ secrets.GIT_USER }}
          GIT_PASS: ${{ secrets.GIT_PASS }}
          GIT_REPO_BASE: ${{ secrets.GIT_REPO_BASE }}
          GIT_HOST: ${{ secrets.GIT_HOST }}
        run: |
          git clone -b main "https://${GIT_USER}:${GIT_PASS}@${GIT_HOST}/${GIT_REPO_BASE}/skillui-pro.git" code

      - name: Git clone repo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GIT_USER: ${{ secrets.GIT_USER }}
          GIT_PASS: ${{ secrets.GIT_PASS }}
          GIT_REPO_BASE: ${{ secrets.GIT_REPO_BASE }}
          GIT_HOST: ${{ secrets.GIT_HOST }}
        run: |
          git clone -b main "https://${env:GIT_USER}:${env:GIT_PASS}@${env:GIT_HOST}/${env:GIT_REPO_BASE}/skillui-pro.git" code

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails
        working-directory: code
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: code/frontend
        run: npm install

      - name: Build Prepare (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev

      - name: Build Wails app (Linux)
        if: runner.os == 'Linux'
        working-directory: code
        run: wails build -platform ${{ matrix.wails_platform }} -trimpath -ldflags "-s -w"

      - name: Build Wails app (Windows)
        if: runner.os == 'Windows'
        working-directory: code
        run: wails build -platform ${{ matrix.wails_platform }} -trimpath -ldflags "-s -w" -nsis

      - name: Build Wails app (macOS)
        if: runner.os == 'macOS'
        working-directory: code
        run: wails build -platform ${{ matrix.wails_platform }} -trimpath -ldflags "-s -w"

      - name: Import Code Signing Certificates
        if: runner.os == 'macOS'
        env:
          CORP_MACOS_CERTIFICATE: ${{ secrets.CORP_MACOS_CERTIFICATE }}
          CORP_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.CORP_MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          echo "$CORP_MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CORP_MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV
          echo "Found signing identity: $SIGNING_IDENTITY"

      - name: Sign macOS Application
        if: runner.os == 'macOS'
        working-directory: code
        run: |
          APP_PATH="build/bin/SkillUI.app"

          find "$APP_PATH" -name "*.dylib" -o -name "*.framework" | while read lib; do
            codesign --force --options runtime --sign "$SIGNING_IDENTITY" "$lib" || true
          done

          codesign --force --options runtime --sign "$SIGNING_IDENTITY" "$APP_PATH/Contents/MacOS/SkillUI"
          codesign --force --options runtime --sign "$SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --verbose=4 "$APP_PATH"

      - name: Create DMG
        if: runner.os == 'macOS'
        working-directory: code
        run: |
          brew install create-dmg

          create-dmg \
            --volname "SkillUI" \
            --volicon "build/bin/SkillUI.app/Contents/Resources/iconfile.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "SkillUI.app" 150 185 \
            --hide-extension "SkillUI.app" \
            --app-drop-link 450 185 \
            --no-internet-enable \
            "SkillUI-darwin-${{ matrix.arch }}.dmg" \
            "build/bin/SkillUI.app" || true

          if [ ! -f "SkillUI-darwin-${{ matrix.arch }}.dmg" ]; then
            hdiutil create -volname "SkillUI" -srcfolder "build/bin/SkillUI.app" -ov -format UDZO "SkillUI-darwin-${{ matrix.arch }}.dmg"
          fi

      - name: Sign DMG
        if: runner.os == 'macOS'
        working-directory: code
        run: |
          codesign --force --sign "$SIGNING_IDENTITY" "SkillUI-darwin-${{ matrix.arch }}.dmg"

      - name: Notarize macOS Application
        if: runner.os == 'macOS'
        working-directory: code
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "SkillUI-darwin-${{ matrix.arch }}.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "SkillUI-darwin-${{ matrix.arch }}.dmg"

      - name: Package Linux build
        if: runner.os == 'Linux'
        working-directory: code
        run: |
          cd build/bin
          tar -czf ../../SkillUI-linux-${{ matrix.arch }}.tar.gz SkillUI

      - name: Package Windows build
        if: runner.os == 'Windows'
        working-directory: code
        run: |
          cd build/bin
          7z a ../../SkillUI-windows-${{ matrix.arch }}.zip SkillUI.exe

      - name: Upload Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: skillui-win-${{ matrix.arch }}
          path: |
            code/SkillUI-windows-${{ matrix.arch }}.zip
            code/build/bin/*-installer.exe

      - name: Upload Artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: skillui-mac-${{ matrix.arch }}
          path: code/SkillUI-darwin-${{ matrix.arch }}.dmg

      - name: Upload Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: skillui-linux-${{ matrix.arch }}
          path: code/SkillUI-linux-${{ matrix.arch }}.tar.gz

      - name: Upload to OSS
        id: oss-upload
        uses: modstart/github-oss-action@master
        with:
          title: ${{ github.ref_name }}
          key-id: ${{ secrets.OSS_2_KEY_ID }}
          key-secret: ${{ secrets.OSS_2_KEY_SECRET }}
          region: ${{ secrets.OSS_2_REGION }}
          bucket: ${{ secrets.OSS_2_BUCKET }}
          callbackTitle: 🎉SkillUI-${{ runner.os }}-Release-${{ github.ref_name }}
          callback: ${{ secrets.REPORT_URL_ME }}
          assets: |
              code/SkillUI-linux-${{ matrix.arch }}.tar.gz:apps/{random}.bin:{name}.tar.gz
              code/SkillUI-darwin-${{ matrix.arch }}.dmg:apps/{random}.bin:{name}.dmg
              code/SkillUI-windows-${{ matrix.arch }}.zip:apps/{random}.bin:{name}.zip
              code/build/bin/*-installer.exe:apps/{random}.bin:{name}.exe

      - name: Save OSS Downloads for Notify
        shell: bash
        env:
          OSS_DOWNLOADS: ${{ steps.oss-upload.outputs.downloads }}
        run: |
          if [ -n "${OSS_DOWNLOADS}" ]; then
            echo "${OSS_DOWNLOADS}" > "oss-downloads-${{ matrix.name }}.json"
          else
            echo "{}" > "oss-downloads-${{ matrix.name }}.json"
          fi

      - name: Upload OSS Downloads Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oss-downloads-${{ matrix.name }}
          path: oss-downloads-${{ matrix.name }}.json

  # ── Release ────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: skillui-*
          path: _artifacts
          merge-multiple: false
      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # Delete any existing release for this tag (handles force-push)
          gh release delete "$TAG" --yes 2>/dev/null || true
          # Create release (draft, idempotent)
          gh release create "$TAG" \
            --title "$TAG" \
            --draft \
            --prerelease=false \
            --notes "" \
            2>/dev/null || true
          # Upload all artifacts
          find _artifacts/ -type f | while read f; do
            echo "Uploading: $(basename "$f")"
            gh release upload "$TAG" "$f" --clobber
          done

  # ── Notify ────────────────────────────────────────────────────────────────────
  notify:
    name: Notify
    needs: [release]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download OSS Downloads Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: oss-downloads-*
          path: _oss-downloads
          merge-multiple: true

      - name: Notify Webhook
        run: |
          MERGED="{}"
          for f in _oss-downloads/*.json; do
            [ -f "$f" ] || continue
            content=$(cat "$f")
            [ -z "$content" ] && content="{}"
            MERGED=$(node -e "
              const a = JSON.parse(process.argv[1]);
              const b = JSON.parse(process.argv[2]);
              console.log(JSON.stringify(Object.assign(a, b)));
            " "$MERGED" "$content")
          done
          echo "::add-mask::${MERGED}"

          NAME="${{ github.event.repository.name }}"
          TYPE=$(echo "${{ github.workflow }}" | tr '[:upper:]' '[:lower:]')
          VERSION=$(sed -n 's/.*Version:[[:space:]]*"v\([^"]*\)".*/\1/p' app.go | head -1)

          PAYLOAD=$(node -e "
            const p = {
              event: process.argv[1],
              param: { name: process.argv[1], type: process.argv[2], version: process.argv[3] },
              data: { name: process.argv[1], type: process.argv[2], version: process.argv[3], downloads: process.argv[4] }
            };
            console.log(JSON.stringify(p));
          " "$NAME" "$TYPE" "$VERSION" "$MERGED")
          echo "::add-mask::${PAYLOAD}"

          curl -X POST "${{ secrets.HOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}"

      - name: Clean up OSS Downloads Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting oss-downloads-* artifacts for run ${{ github.run_id }}..."
          gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("oss-downloads-")) | .id' \
            | while read id; do
              echo "  deleting artifact id=$id"
              gh api "/repos/${{ github.repository }}/actions/artifacts/$id" -X DELETE
            done
          echo "Cleanup done."
